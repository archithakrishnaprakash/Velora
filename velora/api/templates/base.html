<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ page|default("dashboard") }}</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --panel-2:#1d242f; --line:#2c3340; --line-2:#383f4b;
    --ink:#e6edf3; --ink-2:#c3c2b7; --muted:#898781; --accent:#3987e5;
    --critical:#d03b3b; --serious:#ec835a; --warning:#fab219; --good:#0ca30c;
    --low:#3987e5; --info:#898781;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

  /* ---- shell ---- */
  .shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
  nav.side{background:#121821;border-right:1px solid var(--line);padding:14px 0 30px}
  nav.side .brand{padding:4px 16px 14px;font-weight:700;letter-spacing:.4px;font-size:17px}
  nav.side .brand span{color:var(--accent)}
  nav.side .ver{padding:0 16px 14px;font-size:10px;color:var(--muted);
    border-bottom:1px solid var(--line);margin-bottom:10px}
  nav.side .sect{padding:12px 16px 4px;font-size:10px;letter-spacing:.9px;
    text-transform:uppercase;color:var(--muted)}
  nav.side a{display:block;padding:5px 16px;color:var(--ink-2);font-size:13px;
    border-left:2px solid transparent}
  nav.side a:hover{background:var(--panel);text-decoration:none;color:var(--ink)}
  nav.side a.on{background:var(--panel);border-left-color:var(--accent);color:var(--ink);
    font-weight:600}
  main{padding:20px 26px 60px;max-width:1400px}

  /* ---- headings ---- */
  h1{font-size:21px;margin:0 0 2px}
  h2{font-size:15px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);
    font-weight:600}
  h3{font-size:13px;margin:16px 0 6px;font-weight:600;color:var(--ink-2)}
  .lede{color:var(--muted);font-size:12px;margin:0 0 16px}

  /* ---- cards & grids ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;
    margin:14px 0}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;
    margin:12px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card h3{margin-top:0}
  .card .cap{color:var(--muted);font-size:11px;margin-top:8px}
  .kpi{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi.na{font-size:15px;color:var(--muted);font-weight:600}
  .sub{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .chart-empty{color:var(--muted);font-size:12px;font-style:italic;padding:22px 4px;
    border:1px dashed var(--line-2);border-radius:8px;text-align:center}

  /* ---- legend ---- */
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:11px;
    color:var(--ink-2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
    vertical-align:baseline}
  .legend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}

  /* ---- tables ---- */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);
    vertical-align:top}
  tr:last-child td{border-bottom:none}
  th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;
    white-space:nowrap;background:#141a23}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:var(--panel-2)}
  .empty{color:var(--muted);font-style:italic}

  /* ---- pills ---- */
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;
    font-weight:700;white-space:nowrap}
  .sev-critical{background:var(--critical);color:#fff}
  .sev-high{background:var(--serious);color:#20130c}
  .sev-medium{background:var(--warning);color:#241c00}
  .sev-low{background:var(--low);color:#fff}
  .sev-info{background:var(--info);color:#0e1116}
  .tag{display:inline-block;padding:1px 7px;border:1px solid var(--line-2);border-radius:999px;
    font-size:10.5px;color:var(--ink-2);white-space:nowrap}
  .tag.ok{border-color:#1f5c1f;color:#5fce5f}
  .tag.warn{border-color:#6b4e1f;color:var(--warning)}
  .tag.bad{border-color:#6e2626;color:#ef7676}

  /* ---- banners ---- */
  .banner{border-radius:8px;padding:9px 12px;font-size:12px;margin:12px 0;
    border:1px solid var(--line-2);background:var(--panel)}
  .banner.warn{background:#241c12;border-color:#6b4e1f;color:#ffd77a}
  .banner.info{background:#131d2b;border-color:#26456d;color:#aacdf5}

  /* ---- filter row ---- */
  form.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
  form.filters label{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px}
  select,button{background:var(--panel-2);color:var(--ink);border:1px solid var(--line-2);
    border-radius:6px;padding:5px 9px;font:inherit;font-size:12px}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  .kv{display:grid;grid-template-columns:180px minmax(0,1fr);gap:4px 14px;font-size:12.5px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;word-break:break-word}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  pre{background:#11161e;border:1px solid var(--line);border-radius:8px;padding:10px;
    overflow-x:auto;font-size:11.5px;margin:6px 0}
  .card ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
  .card ul li{margin-bottom:6px}
  .card .tw{margin-top:10px}
</style>
</head>
<body>
<div class="shell">
<nav class="side">
  <div class="brand">Vel<span>ora</span></div>
  <div class="ver">v{{ version }} · authorized use only</div>
  {% for section, links in nav %}
    <div class="sect">{{ section }}</div>
    {% for href, label in links %}
      <a href="{{ href }}" class="{{ 'on' if path == href else '' }}">{{ label }}</a>
    {% endfor %}
  {% endfor %}
</nav>
<main>{% block content %}{% endblock %}</main>
</div>
</body>
</html>
