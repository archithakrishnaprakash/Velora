# Velora security gate for GitLab CI.
#
# Copy this into your .gitlab-ci.yml (or `include:` it) and replace the
# `start-application` commands with however your app comes up.
#
# SCOPE AND AUTHORIZATION
#   The default target is an application this job starts on loopback inside the runner.
#   Pointing VELORA_TARGET at anything else asserts that you hold written authorization
#   to test that host. Velora enforces scope on every request; it cannot know whether
#   you are permitted to test a given system.
#
# EXIT CODES
#   0 PASS · 1 FAIL (policy violated) · 2 ERROR (missing/incomplete scan, bad policy).
#   An ERROR fails the job — it never passes silently.

stages:
  - security

variables:
  VELORA_TARGET: "http://127.0.0.1:8080/"
  VELORA_PROFILE: "safe"
  VELORA_DATA_DIR: "$CI_PROJECT_DIR/.velora"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

velora-security-gate:
  stage: security
  image: python:3.11-slim
  timeout: 20m
  cache:
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl
    - python -m pip install --upgrade pip
    - pip install .
  script:
    # ---- start the application under test (loopback only) ----
    - echo "configure a start step for your application" && exit 1
    # - docker compose up -d app        # or your own start command
    - |
      for _ in $(seq 1 30); do
        curl -fsS "$VELORA_TARGET" >/dev/null 2>&1 && break
        sleep 2
      done
    # ---- scan ----
    - |
      velora scan \
        --target "$VELORA_TARGET" \
        --profile "$VELORA_PROFILE" \
        --scope 127.0.0.1 \
        --allow-private \
        --operator "gitlab-ci" \
        --i-am-authorized \
        --scan-id-file velora-scan-id
    - export VELORA_SCAN_ID="$(cat velora-scan-id)"
    # ---- reports (always produced, even when the gate later fails) ----
    - |
      velora report --scan "$VELORA_SCAN_ID" \
        --format sarif --format json --format html \
        --output-dir velora-reports
    # ---- gate: exits 1 on violation, 2 on error ----
    - |
      velora gate evaluate \
        --scan "$VELORA_SCAN_ID" \
        --policy .velora/gate.yaml \
        --output velora-reports/gate.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - velora-reports/
    reports:
      # GitLab reads SARIF for its SAST widget. ReportGenerator writes
      # <scan-id>.sarif, and scan ids look like SCAN-XXXXXX, so the glob has to match
      # that — a velora-*.sarif pattern silently matches nothing and leaves the widget
      # empty.
      sast: velora-reports/SCAN-*.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
